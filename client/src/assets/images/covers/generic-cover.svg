<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ef4444;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#991b1b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#bgGradient)" />
  
  <!-- Decorative elements -->
  <circle cx="350" cy="50" r="80" fill="white" fill-opacity="0.05" />
  <circle cx="50" cy="200" r="100" fill="white" fill-opacity="0.05" />
  
  <!-- Title -->
  <text x="200" y="100" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">Sustainability Report</text>
  
  <!-- Subtitle -->
  <text x="200" y="130" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">Annual ESG Performance Summary</text>
  
  <!-- ESG icon-like element -->
  <g transform="translate(175, 170)">
    <circle cx="0" cy="0" r="30" fill="white" />
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#ef4444">ESG</text>
  </g>
  
  <!-- Decorative sustainability icons -->
  <g transform="translate(110, 170)">
    <path d="M0,-5 L-10,10 L10,10 Z" fill="white" />
    <circle cx="0" cy="-10" r="3" fill="white" />
  </g>
  
  <g transform="translate(240, 170)">
    <circle cx="0" cy="0" r="10" stroke="white" stroke-width="2" fill="none" />
    <line x1="-5" y1="-5" x2="5" y2="5" stroke="white" stroke-width="2" />
    <line x1="-5" y1="5" x2="5" y2="-5" stroke="white" stroke-width="2" />
  </g>
  
  <!-- Year -->
  <text x="370" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="end" fill="white">2023</text>
</svg>