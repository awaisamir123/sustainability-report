<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#8b5cf6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6d28d9;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#bgGradient)" />
  
  <!-- Decorative elements -->
  <circle cx="350" cy="50" r="80" fill="white" fill-opacity="0.05" />
  <circle cx="50" cy="200" r="100" fill="white" fill-opacity="0.05" />
  
  <!-- Title -->
  <text x="200" y="100" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">TCFD Climate Report</text>
  
  <!-- Subtitle -->
  <text x="200" y="130" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">Task Force on Climate-related Financial Disclosures</text>
  
  <!-- TCFD logo-like element -->
  <g transform="translate(175, 170)">
    <circle cx="0" cy="0" r="30" fill="white" />
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#8b5cf6">TCFD</text>
  </g>
  
  <!-- Decorative climate icons -->
  <g transform="translate(110, 170)">
    <path d="M-10,-5 C-10,-12 0,-15 0,-5 C0,5 10,2 10,-5" stroke="white" stroke-width="2" fill="none" />
    <path d="M-10,5 L10,5" stroke="white" stroke-width="2" />
  </g>
  
  <g transform="translate(240, 170)">
    <circle cx="0" cy="-5" r="6" fill="white" />
    <path d="M-10,5 L10,5" stroke="white" stroke-width="2" />
    <path d="M-6,0 L6,0" stroke="white" stroke-width="2" />
  </g>
  
  <!-- Year -->
  <text x="370" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="end" fill="white">2023</text>
</svg>