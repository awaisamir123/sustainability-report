<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg width="400" height="250" viewBox="0 0 400 250" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#22c55e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#15803d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="250" fill="url(#bgGradient)" />
  
  <!-- Decorative elements -->
  <circle cx="350" cy="50" r="80" fill="white" fill-opacity="0.05" />
  <circle cx="50" cy="200" r="100" fill="white" fill-opacity="0.05" />
  
  <!-- Title -->
  <text x="200" y="100" font-family="Arial, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="white">GHG Protocol Report</text>
  
  <!-- Subtitle -->
  <text x="200" y="130" font-family="Arial, sans-serif" font-size="16" text-anchor="middle" fill="white">Greenhouse Gas Emissions Accounting</text>
  
  <!-- GHG logo-like element -->
  <g transform="translate(175, 170)">
    <circle cx="0" cy="0" r="30" fill="white" />
    <text x="0" y="8" font-family="Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#22c55e">GHG</text>
  </g>
  
  <!-- Decorative CO2 molecules -->
  <g transform="translate(110, 170)">
    <circle cx="0" cy="0" r="8" fill="white" />
    <circle cx="10" cy="-10" r="5" fill="white" />
    <circle cx="10" cy="10" r="5" fill="white" />
  </g>
  
  <g transform="translate(240, 170)">
    <circle cx="0" cy="0" r="8" fill="white" />
    <circle cx="-10" cy="0" r="5" fill="white" />
    <circle cx="10" cy="0" r="5" fill="white" />
  </g>
  
  <!-- Year -->
  <text x="370" y="240" font-family="Arial, sans-serif" font-size="16" font-weight="bold" text-anchor="end" fill="white">2023</text>
</svg>